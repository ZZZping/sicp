# /etc/nginx/sites-available/sicp.zzzping.top
# The parent nginx.conf supplies /etc/nginx/mime.types, including XHTML.
server {
    listen 80;
    listen [::]:80;
    server_name sicp.zzzping.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://sicp.zzzping.top$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sicp.zzzping.top;

    ssl_certificate /etc/letsencrypt/live/sicp.zzzping.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sicp.zzzping.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sicp.zzzping.top/current/html;
    index index_zh.xhtml;
    autoindex off;
    server_tokens off;
    access_log /var/log/nginx/sicp.zzzping.top.access.log;
    error_log /var/log/nginx/sicp.zzzping.top.error.log;

    # Revalidate resources so reader fixes do not get stuck in browser caches.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/xhtml+xml image/svg+xml;

    location = / { return 302 /index_zh.xhtml$is_args$args; }
    location = /LICENSE { alias /var/www/sicp.zzzping.top/current/LICENSE; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location ~ (^|/)\. { return 404; }
}
